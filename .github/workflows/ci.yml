name: CI Pipeline - Sport & Fitness

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances
        run: |
          cd backend
          npm install

      - name: Vérifier que le serveur démarre
        run: |
          cd backend
          timeout 10 node server.js &
          sleep 5
          curl http://localhost:3000/products || exit 1

      - name: Test terminé avec succès
        run: echo "✅ CI Pipeline réussi !"
